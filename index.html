<style>
  :root {
    --bg: #f3f6f8; --panel: #ffffff; --ink: #14212b; --muted: #5d6c78;
    --line: #d5dee5; --accent: #0b6e8a; --mark: #ffe08a; --focus: #0b6e8a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1a22; --panel: #15252f; --ink: #e6eef3; --muted: #8fa3b0;
            --line: #263a47; --accent: #5cc4e0; --mark: #6b5a12; --focus: #5cc4e0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
  .head { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none;
            border: 2px solid var(--line); background: var(--panel); }
  h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .sub a { color: var(--accent); }
  .search { position: relative; }
  input[type=search] {
    width: 100%; padding: 16px 18px; font-size: 1.1rem; color: var(--ink);
    background: var(--panel); border: 2px solid var(--line); border-radius: 10px;
  }
  input[type=search]:focus { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
  .meta { display: flex; justify-content: space-between; gap: 12px; margin: 14px 2px 10px;
          color: var(--muted); font-size: 0.9rem; flex-wrap: wrap; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--panel);
       border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  li + li { border-top: 1px solid var(--line); }
  li a { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px;
         color: inherit; text-decoration: none; }
  li a:hover, li a:focus-visible { background: var(--bg); outline: none; box-shadow: inset 3px 0 0 var(--accent); }
  .name { font-weight: 600; }
  .path { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem;
          overflow-wrap: anywhere; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .state { padding: 28px 16px; text-align: center; color: var(--muted); }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
</style>

    <h1 id="title">Repo folder search</h1>
  </div>
  <p class="sub">Type a folder name to filter. Press <b>/</b> to jump to the search box. <a id="repolink" href="#">View repo on GitHub</a></p>

  <div class="search">
    <input id="q" type="search" placeholder="Search folders…" autocomplete="off" aria-label="Search folders" autofocus>
  </div>

  <div class="meta">
    <span id="count" aria-live="polite"></span>
    <label class="toggle"><input type="checkbox" id="top"> Top-level folders only</label>
  </div>

  <ul id="list"></ul>
</main>

<script>
/* ====== EDIT THESE THREE LINES ====== */
const OWNER  = "SurajKumarJha465";
const REPO   = "BEIT-NOTES";
const BRANCH = "main";
/* ==================================== */

const $ = id => document.getElementById(id);
let folders = [];

$("title").textContent = REPO + " folders";
document.title = REPO + " folder search";
$("repolink").href = `https://github.com/${OWNER}/${REPO}`;

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function highlight(text, term) {
  if (!term) return esc(text);
  const i = text.toLowerCase().indexOf(term);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + term.length)) + "</mark>" + esc(text.slice(i + term.length));
}

function render() {
  const term = $("q").value.trim().toLowerCase();
  const topOnly = $("top").checked;
  const hits = folders.filter(f =>
    (!topOnly || !f.includes("/")) && f.toLowerCase().includes(term));
  $("count").textContent = `${hits.length} of ${folders.length} folders`;
  if (!hits.length) {
    $("list").innerHTML = `<li class="state">No folder matches "${esc(term)}". Try a shorter word.</li>`;
    return;
  }
  $("list").innerHTML = hits.slice(0, 500).map(f => {
    const name = f.split("/").pop();
    const parent = f.includes("/") ? f.slice(0, f.lastIndexOf("/")) : "";
    const url = `https://github.com/${OWNER}/${REPO}/tree/${BRANCH}/${f.split("/").map(encodeURIComponent).join("/")}`;
    return `<li><a href="${url}" target="_blank" rel="noopener">
      <span class="name">${highlight(name, term)}</span>
      <span class="path">${esc(parent ? parent + "/" : "(root)")}</span></a></li>`;
  }).join("");
}

async function load() {
  $("list").innerHTML = `<li class="state">Loading folders…</li>`;
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if (res.status === 404) throw new Error("Repo or branch not found. Check OWNER, REPO and BRANCH in index.html, and make sure the repo is public.");
    if (res.status === 403) throw new Error("GitHub's request limit was reached. Wait a few minutes and reload.");
    if (!res.ok) throw new Error("GitHub returned an error (" + res.status + ").");
    const data = await res.json();
    folders = data.tree.filter(n => n.type === "tree").map(n => n.path)
      .sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
    render();
  } catch (e) {
    $("count").textContent = "";
    $("list").innerHTML = `<li class="state">${esc(e.message)}</li>`;
  }
}

$("q").addEventListener("input", render);
$("top").addEventListener("change", render);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});
load();
</script>
