<style>
  :root {
    --bg: #f3f6f8; --panel: #ffffff; --ink: #14212b; --muted: #5d6c78;
    --line: #d5dee5; --accent: #0b6e8a; --accent-ink: #ffffff; --mark: #ffe08a; --focus: #0b6e8a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1a22; --panel: #15252f; --ink: #e6eef3; --muted: #8fa3b0;
            --line: #263a47; --accent: #5cc4e0; --accent-ink: #0e1a22; --mark: #6b5a12; --focus: #5cc4e0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 800px; margin: 0 auto; padding: 48px 20px 80px; }
  .head { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
  .avatar { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; flex: none;
            border: 2px solid var(--line); background: var(--panel); }
  h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .sub a { color: var(--accent); }
  input[type=search] {
    width: 100%; padding: 16px 18px; font-size: 1.1rem; color: var(--ink);
    background: var(--panel); border: 2px solid var(--line); border-radius: 10px;
  }
  input[type=search]:focus { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 2px 10px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg label { padding: 6px 14px; cursor: pointer; font-size: 0.9rem; color: var(--muted); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: -3px; }
  #count { color: var(--muted); font-size: 0.9rem; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--panel);
       border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 16px; }
  li + li { border-top: 1px solid var(--line); }
  li:hover { background: var(--bg); }
  .info { flex: 1; min-width: 0; text-decoration: none; color: inherit; }
  .info:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .path { display: block; color: var(--muted); font-family: ui-monospace, Consolas, monospace;
          font-size: 0.8rem; overflow-wrap: anywhere; }
  .size { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
  button.dl { flex: none; padding: 7px 14px; font: inherit; font-size: 0.9rem; font-weight: 600;
              color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  button.dl:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button.dl:disabled { opacity: 0.6; cursor: progress; }
  button.dl.alt { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .state { padding: 28px 16px; text-align: center; color: var(--muted); display: block; }
  .note { color: var(--muted); font-size: 0.85rem; margin: 10px 2px 0; }
  @media (max-width: 520px) { li { flex-wrap: wrap; } button.dl { margin-left: auto; } }

    <h1 id="title">Repo folder search</h1>
  </div>
  <p class="sub">Search folders and files, then download them. Press <b>/</b> to jump to the search box. <a id="repolink" href="#">View repo on GitHub</a></p>

  <input id="q" type="search" placeholder="Search folders and files… e.g. sem-05, network, .pdf" autocomplete="off" aria-label="Search folders and files" autofocus>

      <label><input type="radio" name="scope" value="all" checked> All</label>
      <label><input type="radio" name="scope" value="dir"> Folders</label>
      <label><input type="radio" name="scope" value="file"> Files</label>
    </div>
    <span id="count" aria-live="polite"></span>
  </div>

  <p class="note">Folders download as a ZIP built in your browser, so large folders can take a while.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ====== EDIT THESE THREE LINES ====== */
const OWNER  = "SurajKumarJha465";
const REPO   = "BEIT-NOTES";
const BRANCH = "main";
/* ==================================== */

const RAW = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;
const MEDIA = `https://media.githubusercontent.com/media/${OWNER}/${REPO}/${BRANCH}/`;   // serves the real file for Git LFS
const GH_RAW = `https://github.com/${OWNER}/${REPO}/raw/${BRANCH}/`;                       // last-resort fallback
const MAX_ROWS = 300;
const BIG_ZIP = 150 * 1024 * 1024;
const $ = id => document.getElementById(id);
let items = [];   // {path, type: "dir"|"file", size}

$("title").textContent = REPO + " search";
document.title = REPO + " search";
$("repolink").href = `https://github.com/${OWNER}/${REPO}`;

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const encPath = p => p.split("/").map(encodeURIComponent).join("/");
const scope = () => document.querySelector('input[name=scope]:checked').value;

function fmtSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function highlight(text, term) {
  const i = term ? text.toLowerCase().indexOf(term) : -1;
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + term.length)) + "</mark>" + esc(text.slice(i + term.length));
}

function render() {
  const term = $("q").value.trim().toLowerCase();
  let s = scope();
  if (s === "all" && !term) s = "dir";           // empty search: show the folder list
  const pool = items.filter(it => s === "all" || it.type === s);
  const hits = pool.filter(it => it.path.toLowerCase().includes(term));
  $("count").textContent = `${hits.length} result${hits.length === 1 ? "" : "s"}`;
  if (!hits.length) {
    $("list").innerHTML = `<li><span class="state">Nothing matches "${esc(term)}". Try a shorter word or switch to All.</span></li>`;
    return;
  }
  const rows = hits.slice(0, MAX_ROWS).map((it, n) => {
    const name = it.path.split("/").pop();
    const parent = it.path.includes("/") ? it.path.slice(0, it.path.lastIndexOf("/") + 1) : "(root)";
    const kind = it.type === "dir" ? "tree" : "blob";
    const url = `https://github.com/${OWNER}/${REPO}/${kind}/${BRANCH}/${encPath(it.path)}`;
    const size = it.type === "file" ? `<span class="size">${fmtSize(it.size)}</span>` : "";
    const label = it.type === "dir" ? "Download ZIP" : "Download";
    return `<li><a class="info" href="${url}" target="_blank" rel="noopener">
        <span class="name">${highlight(name, term)}${it.type === "dir" ? "/" : ""}</span>
        <span class="path">${highlight(parent, term)}</span></a>${size}
        <button class="dl${it.type === "dir" ? " alt" : ""}" data-i="${items.indexOf(it)}">${label}</button></li>`;
  });
  if (hits.length > MAX_ROWS) rows.push(`<li><span class="state">Showing the first ${MAX_ROWS}. Keep typing to narrow the list.</span></li>`);
  $("list").innerHTML = rows.join("");
}

function saveBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
const MIME = {pdf: "application/pdf", zip: "application/zip", png: "image/png", jpg: "image/jpeg",
  jpeg: "image/jpeg", txt: "text/plain", doc: "application/msword", ppt: "application/vnd.ms-powerpoint",
  docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  pptx: "application/vnd.openxmlformats-officedocument.presentationml.presentation"};
const extOf = p => (p.split(".").pop() || "").toLowerCase();

// Git LFS stores a ~130 byte text "pointer" in the repo instead of the real file.
// raw.githubusercontent.com returns that pointer, which is what makes a PDF look damaged.
function isLfsPointer(buf) {
  if (buf.byteLength > 1024) return false;
  return new TextDecoder().decode(buf).startsWith("version https://git-lfs.github.com/spec");
}
function isPdf(buf) {
  const head = new Uint8Array(buf.slice(0, 1024));
  return new TextDecoder("latin1").decode(head).includes("%PDF-");
}
async function fetchBuf(url, path) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Could not download ${path} (${r.status}).`);
  return r.arrayBuffer();
}
async function getBlob(path) {
  let buf = await fetchBuf(RAW + encPath(path), path);
  if (isLfsPointer(buf)) buf = await fetchBuf(MEDIA + encPath(path), path);   // fetch the real LFS file
  if (isLfsPointer(buf)) throw new Error(`${path} is stored with Git LFS and could not be fetched.`);
  if (extOf(path) === "pdf" && !isPdf(buf)) throw new Error(`${path} did not download as a valid PDF.`);
  return new Blob([buf], {type: MIME[extOf(path)] || "application/octet-stream"});
}

async function download(it, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  try {
    if (it.type === "file") {
      btn.textContent = "Downloading…";
      try {
        saveBlob(await getBlob(it.path), it.path.split("/").pop());
      } catch (err) {
        // fetch blocked or failed: let the browser download it directly (GitHub redirects LFS files correctly)
        const a = document.createElement("a");
        a.href = GH_RAW + encPath(it.path);
        a.download = it.path.split("/").pop();
        document.body.appendChild(a); a.click(); a.remove();
      }
    } else {
      const prefix = it.path + "/";
      const files = items.filter(f => f.type === "file" && f.path.startsWith(prefix));
      if (!files.length) throw new Error("This folder has no files.");
      const total = files.reduce((n, f) => n + f.size, 0);
      if (total > BIG_ZIP && !confirm(`This folder is ${fmtSize(total)}. Download anyway?`)) return;
      if (typeof JSZip === "undefined") throw new Error("ZIP library failed to load. Check your connection and reload.");
      const zip = new JSZip();
      let done = 0;
      for (const f of files) {
        btn.textContent = `Zipping ${++done}/${files.length}`;
        zip.file(f.path.slice(prefix.length), await getBlob(f.path), {binary: true});
      }
      btn.textContent = "Building ZIP…";
      saveBlob(await zip.generateAsync({type: "blob", compression: "STORE"}), it.path.split("/").pop() + ".zip");
    }
  } catch (e) {
    alert(e.message);
  } finally {
    btn.textContent = original;
    btn.disabled = false;
  }
}

async function load() {
  $("list").innerHTML = `<li><span class="state">Loading folders and files…</span></li>`;
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if (res.status === 404) throw new Error("Repo or branch not found. Check OWNER, REPO and BRANCH in index.html, and make sure the repo is public.");
    if (res.status === 403) throw new Error("GitHub's request limit was reached. Wait a few minutes and reload.");
    if (!res.ok) throw new Error("GitHub returned an error (" + res.status + ").");
    const data = await res.json();
    items = data.tree
      .filter(n => n.type === "tree" || n.type === "blob")
      .map(n => ({path: n.path, type: n.type === "tree" ? "dir" : "file", size: n.size || 0}))
      .sort((a, b) => a.path.localeCompare(b.path, undefined, {numeric: true}));
    render();
  } catch (e) {
    $("count").textContent = "";
    $("list").innerHTML = `<li><span class="state">${esc(e.message)}</span></li>`;
  }
}

$("q").addEventListener("input", render);
document.querySelectorAll('input[name=scope]').forEach(r => r.addEventListener("change", render));
$("list").addEventListener("click", e => {
  const b = e.target.closest("button.dl");
  if (b) download(items[+b.dataset.i], b);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
});
load();
</script>
</body>
